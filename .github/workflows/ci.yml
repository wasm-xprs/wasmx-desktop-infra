name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate hot reload policy
        shell: bash
        run: |
          ruby <<'RUBY'
          require "json"

          policy = JSON.parse(File.read("hot-reload-policy.json"))
          abort "wrong hot reload policy schema" unless policy["schema"] == "ores.desktop-hot-reload/v1"
          abort "hot reload policy product mismatch" unless policy["product"] == "wasm-xprs"

          defaults = policy.fetch("default")
          allowed_front = %w[none nginx haproxy caddy]
          allowed_routes = %w[beam native_atomic external_process wasm_generation nginx_worker_generation haproxy_runtime caddy_admin]
          allowed_middleware = %w[beam_hot_code process_generation wasm_generation declarative_only]

          abort "invalid front proxy" unless allowed_front.include?(defaults["front_proxy"])
          abort "invalid route backend" unless allowed_routes.include?(defaults["route_backend"])
          abort "invalid middleware reload mode" unless allowed_middleware.include?(defaults["middleware_code_reload"])
          abort "route drain timeout must be bounded" unless defaults["route_drain_timeout_ms"].is_a?(Integer) && defaults["route_drain_timeout_ms"].between?(1, 86_400_000)
          abort "old generation retention must be bounded" unless defaults["max_old_generations"].is_a?(Integer) && defaults["max_old_generations"].between?(1, 4)

          supported_front = policy.fetch("supported_front_proxies")
          supported_routes = policy.fetch("supported_route_backends")
          supported_middleware = policy.fetch("supported_middleware_code_reload")
          abort "unsupported/duplicate front proxy entry" unless supported_front.uniq == supported_front && supported_front.all? { |v| allowed_front.include?(v) } && supported_front.include?(defaults["front_proxy"])
          abort "unsupported/duplicate route backend entry" unless supported_routes.uniq == supported_routes && supported_routes.all? { |v| allowed_routes.include?(v) } && supported_routes.include?(defaults["route_backend"])
          abort "unsupported/duplicate middleware reload entry" unless supported_middleware.uniq == supported_middleware && supported_middleware.all? { |v| allowed_middleware.include?(v) } && supported_middleware.include?(defaults["middleware_code_reload"])

          case defaults["route_backend"]
          when "nginx_worker_generation"
            abort "nginx reload backend requires nginx front proxy" unless defaults["front_proxy"] == "nginx"
          when "haproxy_runtime"
            abort "HAProxy runtime backend requires haproxy front proxy" unless defaults["front_proxy"] == "haproxy"
          when "caddy_admin"
            abort "Caddy admin backend requires caddy front proxy" unless defaults["front_proxy"] == "caddy"
          end

          if defaults["proxy_managed_application_routes"]
            abort "proxy-managed routes require a proxy-owned route backend" unless %w[nginx_worker_generation haproxy_runtime caddy_admin].include?(defaults["route_backend"])
          end

          invariants = policy.fetch("invariants")
          abort "routing/middleware isolation invariant weakened" unless invariants["routing_middleware_separate_from_compute"] == true
          abort "route reload may not restart standalone server" unless invariants["route_change_restarts_standalone_server"] == false
          abort "route reload may not restart lambda workers" unless invariants["route_change_restarts_lambda_workers"] == false
          abort "arbitrary native middleware may not share router process" unless invariants["arbitrary_native_middleware_in_router_process"] == false
          abort "old generation draining must be bounded" unless invariants["bounded_old_generation_drain"] == true
          RUBY
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done
      - name: Validate launchd plist XML
        run: python3 -c 'import xml.etree.ElementTree as E; E.parse("services/launchd/com.wasm-xprs.daemon.plist")'
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "services/windows/install-task.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "services/windows/uninstall-task.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Check required manifest invariants
        run: |
          grep -q 'WASMX_DESKTOP_ADDR: "127.0.0.1:8765"' .ores-compose.yaml
          grep -q 'WASMX_MAX_PARALLEL_COMPILES: "2"' .ores-compose.yaml
          grep -q 'WASMX_MAX_CACHED_MODULES: "32"' .ores-compose.yaml
          grep -q 'WASMX_MAX_TENANT_DEPLOYMENTS: "64"' .ores-compose.yaml
          grep -q 'WASMX_MAX_TENANT_STORAGE_BYTES: "536870912"' .ores-compose.yaml
          grep -q '/readyz' .ores-compose.yaml
          grep -q 'commit: 809ac1a88b9167e560bf5f7779cfdb79f44068fa' .ores-compose.yaml
          grep -q 'cloudflared' .ores-compose.yaml
          grep -q 'TUNNEL_TOKEN' .ores-compose.yaml
          ! grep -Fq '0.0.0.0' .ores-compose.yaml
      - name: Check systemd hardening invariants
        run: |
          grep -q '^NoNewPrivileges=true$' services/systemd/wasmx-desktop-daemon.service
          grep -q '^PrivateDevices=true$' services/systemd/wasmx-desktop-daemon.service
          grep -q '^CapabilityBoundingSet=$' services/systemd/wasmx-desktop-daemon.service
          grep -q '^RestrictAddressFamilies=AF_INET AF_INET6$' services/systemd/wasmx-desktop-daemon.service
          grep -q '^Environment=WASMX_MAX_TENANT_DEPLOYMENTS=64$' services/systemd/wasmx-desktop-daemon.service
          grep -q '^Environment=WASMX_MAX_TENANT_STORAGE_BYTES=536870912$' services/systemd/wasmx-desktop-daemon.service

      - name: Check launchd resource invariants
        run: |
          grep -q '<key>WASMX_MAX_TENANT_DEPLOYMENTS</key>' services/launchd/com.wasm-xprs.daemon.plist
          grep -q '<string>64</string>' services/launchd/com.wasm-xprs.daemon.plist
          grep -q '<key>WASMX_MAX_TENANT_STORAGE_BYTES</key>' services/launchd/com.wasm-xprs.daemon.plist
          grep -q '<string>536870912</string>' services/launchd/com.wasm-xprs.daemon.plist

      - name: Check verification-script security invariants
        run: |
          grep -q 'refusing insecure or unsupported daemon URL' scripts/verify-daemon.sh
          grep -q 'daemon token must be a regular non-symlink file' scripts/verify-daemon.sh
          grep -q -- "--proto '=http,https'" scripts/verify-daemon.sh
          grep -q 'runtime_contract_verified' scripts/verify-daemon.sh
          grep -q '"guest_abi": "wasmx-v1"' scripts/verify-daemon.sh
          grep -q '"target_triple": "wasm32-unknown-unknown"' scripts/verify-daemon.sh
          grep -q '"wasi_enabled": False' scripts/verify-daemon.sh
